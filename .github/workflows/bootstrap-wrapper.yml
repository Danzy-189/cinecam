# Generates gradlew / gradlew.bat / gradle-wrapper.jar and commits them.
# Run it once from the Actions tab if you want to build locally with ./gradlew.
name: Bootstrap Gradle wrapper

on:
  workflow_dispatch:

jobs:
  wrapper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.2'

      - name: Generate wrapper
        run: gradle wrapper --gradle-version 8.14.2 --distribution-type bin

      - name: Commit wrapper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper
          git commit -m "chore: add gradle wrapper" || echo "nothing to commit"
          git push
